<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="736" viewBox="0 0 1040 736" role="img" aria-labelledby="retro-arch-title retro-arch-desc">
  <title id="retro-arch-title">retro 经验飞轮</title>
  <desc id="retro-arch-desc">retro 的运行闭环：会话收尾沉淀经验入账，index 编译为结构化条目，agent 工作时应用经验并把 ok/fail 结果写回知识库；定期审计经用户门控后升级规则到 AGENTS.md 或降级回炉，精修后的知识库进入下一轮沉淀。中心的经验库随每轮循环复利累积。虚线辐条把每次应用结果写回知识库，审计轮经用户确认驱动升级与降级。</desc>

  <defs>
    <marker id="retro-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7D8590"/>
    </marker>
    <marker id="retro-arch-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B949E"/>
    </marker>
  </defs>

  <!-- paper -->
  <rect width="1040" height="736" fill="#0D1117"/>

  <!-- ===== ring flow (drawn before boxes) ===== -->
  <g fill="none" stroke="#7D8590" stroke-width="1.2">
    <path d="M 640 154 A 256 256 0 0 1 709.6 208" marker-end="url(#retro-arch-arrow)"/>
    <path d="M 761.8 296 A 256 256 0 0 1 761.8 464" marker-end="url(#retro-arch-arrow)"/>
    <path d="M 709.6 552 A 256 256 0 0 1 640 606" marker-end="url(#retro-arch-arrow)"/>
    <path d="M 400 606 A 256 256 0 0 1 330.4 552" marker-end="url(#retro-arch-arrow)"/>
    <path d="M 278.2 464 A 256 256 0 0 1 278.2 296" marker-end="url(#retro-arch-arrow)"/>
    <path d="M 330.4 208 A 256 256 0 0 1 400 154" marker-end="url(#retro-arch-arrow)"/>
  </g>

  <!-- ===== dashed write-back spokes ===== -->
  <g fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="5,4">
    <path d="M 520 168 L 520 314" marker-end="url(#retro-arch-arrow-soft)"/>
    <path d="M 663.8 296 L 629.1 317" marker-end="url(#retro-arch-arrow-soft)"/>
    <path d="M 663.8 464 L 629.1 443" marker-end="url(#retro-arch-arrow-soft)"/>
    <path d="M 520 592 L 520 446" marker-end="url(#retro-arch-arrow-soft)"/>
    <path d="M 376.2 464 L 410.9 443" marker-end="url(#retro-arch-arrow-soft)"/>
    <path d="M 376.2 296 L 410.9 317" marker-end="url(#retro-arch-arrow-soft)"/>
  </g>

  <!-- ===== spoke labels (masks beside the lines, 8px gap) ===== -->
  <g font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#8B949E" letter-spacing="0.06em">
    <rect x="528" y="236" width="60" height="20" rx="2" fill="#0D1117"/>
    <text x="534" y="250">RAW LOG</text>
    <rect x="672" y="436" width="76" height="20" rx="2" fill="#0D1117"/>
    <text x="678" y="450">OK / FAIL</text>
  </g>

  <!-- ===== stations ===== -->
  <!-- s0 沉淀 (top) -->
  <rect x="400" y="80" width="240" height="88" rx="6" fill="#161B22" stroke="rgba(230,237,243,0.14)" stroke-width="1"/>
  <text x="520" y="120" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#E6EDF3">沉淀</text>
  <text x="520" y="144" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#7D8590">会话收尾 · 写入 log</text>

  <!-- s1 编译 (upper right) -->
  <rect x="620" y="208" width="240" height="88" rx="6" fill="#161B22" stroke="rgba(230,237,243,0.14)" stroke-width="1"/>
  <text x="740" y="248" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#E6EDF3">编译</text>
  <text x="740" y="272" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#7D8590">index · 派生字段</text>

  <!-- s2 应用 (lower right) -->
  <rect x="620" y="464" width="240" height="88" rx="6" fill="#161B22" stroke="rgba(230,237,243,0.14)" stroke-width="1"/>
  <text x="740" y="504" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#E6EDF3">应用</text>
  <text x="740" y="528" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#7D8590">干活时调用 · ok / fail</text>

  <!-- s3 审计 (bottom, focal) -->
  <rect x="400" y="592" width="240" height="88" rx="6" fill="rgba(63,185,80,0.12)" stroke="#3FB950" stroke-width="1.2"/>
  <text x="520" y="632" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#3FB950">审计</text>
  <text x="520" y="656" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#7D8590">六区块报告 · 用户门控</text>

  <!-- s4 升级 (lower left) -->
  <rect x="180" y="464" width="240" height="88" rx="6" fill="#161B22" stroke="rgba(230,237,243,0.14)" stroke-width="1"/>
  <text x="300" y="504" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#E6EDF3">升级</text>
  <text x="300" y="528" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#7D8590">--apply → AGENTS.md</text>

  <!-- s5 精修 (upper left) -->
  <rect x="180" y="208" width="240" height="88" rx="6" fill="#161B22" stroke="rgba(230,237,243,0.14)" stroke-width="1"/>
  <text x="300" y="248" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#E6EDF3">精修</text>
  <text x="300" y="272" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#7D8590">demote · dismiss · scope 回填</text>

  <!-- ===== hub: the one light element (accumulated state) ===== -->
  <rect x="400" y="320" width="240" height="120" rx="8" fill="#E6EDF3"/>
  <text x="520" y="376" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#0D1117">经验库</text>
  <text x="520" y="402" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" font-size="12" fill="#57606A">.retro/ · 只追加 · 复利累积</text>

  <!-- ===== legend (horizontal bottom strip) ===== -->
  <line x1="64" y1="704" x2="976" y2="704" stroke="rgba(230,237,243,0.10)" stroke-width="0.8"/>
  <text x="64" y="726" fill="#7D8590" font-size="12" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="200" y1="722" x2="244" y2="722" stroke="#7D8590" stroke-width="1.2" marker-end="url(#retro-arch-arrow)"/>
  <text x="256" y="726" fill="#7D8590" font-size="12" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace">主流程 · 顺时针</text>
  <line x1="432" y1="722" x2="476" y2="722" stroke="#8B949E" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#retro-arch-arrow-soft)"/>
  <text x="488" y="726" fill="#7D8590" font-size="12" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace">写回知识库</text>
  <rect x="632" y="712" width="24" height="16" rx="2" fill="rgba(63,185,80,0.12)" stroke="#3FB950" stroke-width="1"/>
  <text x="668" y="726" fill="#7D8590" font-size="12" font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace">用户门控焦点</text>
</svg>
